<!--
  EXAMPLE: 3-phase animation pattern
  ==================================
  Demonstrates how to author a 3-phase animation that walks the reader through
  a multi-step transformation. The example below shows a market concentrating
  over three quarters: Q1 (fragmented across five firms) → Q2 (a leader emerges)
  → Q3 (one firm dominates).

  Pattern to copy:
    - Scoped CSS variables inside <style> (using #anim-X-fig as the scope selector,
      NEVER :root — see bear trap B.1)
    - Three @keyframes for the three phase opacities
    - Elements stay visible during one phase via the .phase-N class
    - Loop duration: 6s for 3-phase pattern (2s per phase)
    - role="img" + aria-labelledby pointing to title + desc

  Replace the market-share content with your own concept and reuse the
  scaffolding (CSS, animation class structure, accessibility).
-->

<figure role="figure" aria-labelledby="anim-market-cap">
<svg role="img"
     aria-labelledby="anim-market-title anim-market-desc"
     viewBox="0 0 820 320"
     style="width:100%; height:auto; max-width:820px; background:#161922; border:1px solid #2a2f42; border-radius:8px;">

  <title id="anim-market-title">Market concentration visualized: firm shares across three quarters</title>
  <desc id="anim-market-desc">A 3-phase animation. Phase 1 (0-2s): bars show each firm's share of the market
  in Q1 — fragmented, five firms between 10% and 32%. Phase 2 (2-4s): Q2 — a leader emerges, the top firm
  reaching ~58%. Phase 3 (4-6s): Q3 — the market concentrates, the leading firm holding ~95% while the
  others fall near zero. Loops forever.</desc>

  <style>
    /* CRITICAL: scope to #anim-market-fig, NEVER :root. A :root selector
       inside <style> inside <svg> LEAKS to the entire document and overrides
       page-level CSS variables. See bear trap B.1. */
    #anim-market-fig {
      --bg: #0f1117;        --panel: #161922;     --panel-2: #1c2030;
      --text: #e6e8ee;      --muted: #8d94a8;     --line: #2a2f42;
      --yellow: #fbbf24;    --orange: #fb923c;    --cyan: #06b6d4;
    }

    #anim-market-fig .prose { font-family: system-ui, sans-serif; fill: var(--text); font-size: 12px; }
    #anim-market-fig .muted { font-family: system-ui, sans-serif; fill: var(--muted); font-size: 11px; }
    #anim-market-fig .mono  { font-family: ui-monospace, monospace; fill: var(--text); font-size: 12px; }
    #anim-market-fig .title { font-family: system-ui, sans-serif; fill: var(--text); font-size: 13px; font-weight: 600; }

    /* Three phases over a 6s loop:
       Phase 1 visible 0-30%   (Q1, fragmented market)
       Phase 2 visible 35-65%  (Q2, a leader emerges)
       Phase 3 visible 70-95%  (Q3, concentrated market)
       4% gap between phases for smooth fade transitions. */
    @keyframes phase-1 {
      0%, 25%    { opacity: 1; }
      33%, 100%  { opacity: 0; }
    }
    @keyframes phase-2 {
      0%, 33%    { opacity: 0; }
      40%, 60%   { opacity: 1; }
      67%, 100%  { opacity: 0; }
    }
    @keyframes phase-3 {
      0%, 67%    { opacity: 0; }
      75%, 92%   { opacity: 1; }
      100%       { opacity: 0; }
    }

    #anim-market-fig .p1 { animation: phase-1 6s ease-in-out infinite; }
    #anim-market-fig .p2 { animation: phase-2 6s ease-in-out infinite; opacity: 0; }
    #anim-market-fig .p3 { animation: phase-3 6s ease-in-out infinite; opacity: 0; }
  </style>

  <g id="anim-market-fig">

    <!-- Title strip -->
    <text x="20" y="24" class="title">Market concentration — firm shares across three quarters</text>
    <text x="800" y="24" text-anchor="end" class="muted">5 firms · total = 100%</text>

    <!-- Baseline axis -->
    <line x1="40" y1="240" x2="780" y2="240" stroke="var(--line)" stroke-width="1"/>

    <!-- Axis labels: 5 firms -->
    <g class="muted" text-anchor="middle">
      <text x="110" y="262">A</text>
      <text x="240" y="262">B</text>
      <text x="370" y="262">C</text>
      <text x="500" y="262">D</text>
      <text x="630" y="262">E</text>
    </g>

    <!-- y-axis -->
    <line x1="40" y1="60" x2="40" y2="240" stroke="var(--line)" stroke-width="1"/>
    <text x="32" y="64" text-anchor="end" class="muted">100%</text>
    <text x="32" y="244" text-anchor="end" class="muted">0%</text>

    <!-- ============================================================
         PHASE 1: Q1 — fragmented market (five firms, no clear leader)
         Firm shares (%): A=32, B=22, C=20, D=15, E=10   (sum = 99 ≈ 100)
         Bar heights: share% * 1.8px scale  (100% → 180px)
         A:  32 * 1.8 = 58   → y = 240 - 58 = 182, h=58
         B:  22 * 1.8 = 40   → y = 200, h=40
         C:  20 * 1.8 = 36   → y = 204, h=36
         D:  15 * 1.8 = 27   → y = 213, h=27
         E:  10 * 1.8 = 18   → y = 222, h=18
         Sum: 58+40+36+27+18 = 179 px ≈ 180 ✓ (shares sum to ~100%)
         ============================================================ -->
    <g class="p1">
      <rect x="75"  y="182" width="70" height="58" fill="var(--orange)" opacity="0.9" rx="2"/>
      <rect x="205" y="200" width="70" height="40" fill="var(--orange)" opacity="0.7" rx="2"/>
      <rect x="335" y="204" width="70" height="36" fill="var(--orange)" opacity="0.7" rx="2"/>
      <rect x="465" y="213" width="70" height="27" fill="var(--orange)" opacity="0.55" rx="2"/>
      <rect x="595" y="222" width="70" height="18" fill="var(--orange)" opacity="0.5" rx="2"/>
      <text x="110" y="176" text-anchor="middle" class="mono">32%</text>
      <text x="240" y="194" text-anchor="middle" class="mono">22%</text>
      <text x="370" y="198" text-anchor="middle" class="mono">20%</text>
      <text x="500" y="207" text-anchor="middle" class="mono">15%</text>
      <text x="630" y="216" text-anchor="middle" class="mono">10%</text>
      <!-- State label for phase 1 -->
      <rect x="40" y="34" width="170" height="22" rx="4" fill="var(--panel-2)" stroke="var(--yellow)"/>
      <text x="125" y="49" text-anchor="middle" class="prose" fill="var(--yellow)" font-weight="600">Q1  (fragmented)</text>
    </g>

    <!-- ============================================================
         PHASE 2: Q2 — a leader emerges
         Firm shares (%): A=58, B=20, C=14, D=6, E=2   (sum = 100)
         Bar heights: share% * 1.8
         A: 105, B:  35, C: 26, D: 11, E: 3
         Sum: 180 ✓
         ============================================================ -->
    <g class="p2">
      <rect x="75"  y="135" width="70" height="105" fill="var(--cyan)" opacity="0.9" rx="2"/>
      <rect x="205" y="205" width="70" height="35"  fill="var(--cyan)" opacity="0.7" rx="2"/>
      <rect x="335" y="214" width="70" height="26"  fill="var(--cyan)" opacity="0.65" rx="2"/>
      <rect x="465" y="229" width="70" height="11"  fill="var(--cyan)" opacity="0.5" rx="2"/>
      <rect x="595" y="237" width="70" height="3"   fill="var(--cyan)" opacity="0.4" rx="2"/>
      <text x="110" y="129" text-anchor="middle" class="mono">58%</text>
      <text x="240" y="199" text-anchor="middle" class="mono">20%</text>
      <text x="370" y="208" text-anchor="middle" class="mono">14%</text>
      <text x="500" y="223" text-anchor="middle" class="mono">6%</text>
      <text x="630" y="231" text-anchor="middle" class="mono">2%</text>
      <rect x="40" y="34" width="170" height="22" rx="4" fill="var(--panel-2)" stroke="var(--cyan)"/>
      <text x="125" y="49" text-anchor="middle" class="prose" fill="var(--cyan)" font-weight="600">Q2  (consolidating)</text>
    </g>

    <!-- ============================================================
         PHASE 3: Q3 — one firm dominates (concentrated market)
         Firm shares (%): A=95, B=2, C=1, D=~0, E=~0
         Bar heights:
         A:  95 * 1.8 = 171, B: 4, C: 2, D: 0.5, E: 0.5
         ============================================================ -->
    <g class="p3">
      <rect x="75"  y="69"  width="70" height="171" fill="var(--yellow)" opacity="0.95" rx="2"/>
      <rect x="205" y="236" width="70" height="4"   fill="var(--yellow)" opacity="0.4" rx="2"/>
      <rect x="335" y="238" width="70" height="2"   fill="var(--yellow)" opacity="0.3" rx="2"/>
      <rect x="465" y="239.5" width="70" height="0.5" fill="var(--yellow)" opacity="0.2" rx="2"/>
      <rect x="595" y="239.5" width="70" height="0.5" fill="var(--yellow)" opacity="0.2" rx="2"/>
      <text x="110" y="63"  text-anchor="middle" class="mono" fill="var(--yellow)" font-weight="600">95%</text>
      <text x="240" y="232" text-anchor="middle" class="mono">2%</text>
      <text x="370" y="234" text-anchor="middle" class="mono">1%</text>
      <text x="500" y="234" text-anchor="middle" class="mono">~0</text>
      <text x="630" y="234" text-anchor="middle" class="mono">~0</text>
      <rect x="40" y="34" width="170" height="22" rx="4" fill="var(--panel-2)" stroke="var(--yellow)"/>
      <text x="125" y="49" text-anchor="middle" class="prose" fill="var(--yellow)" font-weight="600">Q3  (concentrated)</text>
    </g>

    <!-- Bottom annotation -->
    <text x="400" y="298" text-anchor="middle" class="muted" font-style="italic">
      Same five firms each quarter — shares shift from fragmented (Q1) to concentrated (Q3).
    </text>

  </g>
</svg>

<figcaption id="anim-market-cap">
  <strong>Animation:</strong> The same five firms tracked across three quarters as the market
  concentrates. Notice how Q1 is fragmented — no firm holds more than a third of the market —
  while by Q3 the leading firm has captured ~95% and the rest fall near zero. All three frames
  respect <em>share conservation</em>: the bar heights sum to the same total (~100%) at every quarter.
</figcaption>
</figure>


<!-- ============================================================================
     COMMENTARY (read me, then delete me from your tutorial)
     ============================================================================

     What this example demonstrates as a pattern you can reuse:

     1. ALWAYS scope CSS variables to #anim-X-fig, never :root.
        See bear trap B.1: a :root inside SVG <style> leaks to the document.

     2. ALL coordinates are derivable from the math.
        Every bar height is share(%) * 1.8 px. Every position is computed, not
        hand-tuned. See bear trap B.7: visual encoding must match the math.

     3. Share conservation is verified.
        Phase 1 bar heights: 58+40+36+27+18 = 179 ≈ 180 ✓
        Phase 2: 105+35+26+11+3 = 180 ✓
        Phase 3: 171+4+2+0.5+0.5 = 178 (close enough for visual)

     4. Color encodes meaning.
        Q1 (fragmented) = orange. Q2 (consolidating) = cyan.
        Q3 (concentrated) = yellow (the dominant firm). Choose your own palette
        based on what you want the reader to feel about each phase.

     5. Three phases timing: 6-second cycle, 30% per phase + 4-7% fade gaps.
        Adjust to taste; readable 3-phase animations are 5-7 seconds total.

     6. Full accessibility:
        - role="img" + aria-labelledby
        - <title> + <desc> for screen readers
        - <desc> describes BOTH the visual AND the educational content

     For a SWEEPER animation (continuous parameter sweep) rather than discrete
     3-phase, see animation-sweeper.html.
     ============================================================================ -->

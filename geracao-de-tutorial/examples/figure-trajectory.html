<!--
  EXAMPLE: Trajectory plot (multiple metrics over stages/time)
  =============================================================
  Static figure showing how multiple metrics evolve across release milestones,
  project phases, or time. Often the headline figure of a product review or launch readout.

  Concrete example: 3 metrics (Active users, Retention, NPS) tracked across
  the release milestones of a product (MVP → v1 → v2 → v3), with one milestone
  cut from the roadmap. Includes a horizontal "benchmark" reference line.

  Use when:
    - The story is "metric X went UP from launch to the latest release"
    - Multiple metrics matter and they may move in different directions
    - The trade-offs between metrics are part of the lesson
-->

<figure role="figure" aria-labelledby="fig-traj-cap" aria-describedby="fig-traj-desc">
<svg role="img"
     aria-labelledby="fig-traj-title fig-traj-desc"
     viewBox="0 0 820 380"
     style="width:100%; height:auto; max-width:820px; background:#161922; border:1px solid #2a2f42; border-radius:8px;">

  <title id="fig-traj-title">Key product metrics across release milestones</title>
  <desc id="fig-traj-desc">A multi-line trajectory plot showing three product metrics evolving across
    release milestones (MVP, v1, v1.5 cut, v2, v3). The blue line is "Active users" rising
    from 14% at MVP to 34% at v3. The green line is "Retention" rising from 22% to 80%, dipping
    at v2 to 41% then recovering. The dashed yellow line is "NPS" (the trade-off) hovering
    around 44% from MVP through v2 then dropping to 35% at v3. A horizontal dashed reference line
    at 25% shows the industry benchmark. The v1.5 milestone is grayed out (cut from the roadmap).</desc>

  <style>
    #fig-traj-svg .axis  { stroke: #2a2f42; stroke-width: 1.5; }
    #fig-traj-svg .tick  { stroke: #2a2f42; stroke-width: 1; }
    #fig-traj-svg .grid  { stroke: #2a2f42; stroke-width: 0.5; stroke-dasharray: 2 4; opacity: 0.5; }
    #fig-traj-svg .ref   { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.6; }
    #fig-traj-svg .line-A { stroke: #7aa2f7; stroke-width: 3; fill: none; }
    #fig-traj-svg .line-B { stroke: #10b981; stroke-width: 3; fill: none; }
    #fig-traj-svg .line-C { stroke: #fbbf24; stroke-width: 3; stroke-dasharray: 6 3; fill: none; }
    #fig-traj-svg .dot-A  { fill: #7aa2f7; }
    #fig-traj-svg .dot-B  { fill: #10b981; }
    #fig-traj-svg .dot-C  { fill: #fbbf24; }
    #fig-traj-svg .title { font-family: system-ui, sans-serif; fill: #e6e8ee; font-size: 13px; font-weight: 600; }
    #fig-traj-svg .lbl   { font-family: ui-monospace, monospace; fill: #e6e8ee; font-size: 11px; font-weight: 600; }
    #fig-traj-svg .muted { font-family: system-ui, sans-serif; fill: #8d94a8; font-size: 11px; }
    #fig-traj-svg .ann   { font-family: system-ui, sans-serif; fill: #94a3b8; font-style: italic; font-size: 10px; }
    #fig-traj-svg .stage-lbl { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
  </style>

  <g id="fig-traj-svg">

    <text x="20" y="28" class="title">Key metrics across the release roadmap</text>

    <!-- =================== COORDINATE SYSTEM =================== -->
    <!-- Plot area: x from 100 (MVP) to 740 (v3); 640 px wide; 5 milestone positions ~160 px apart
         y axis: 320 (0%) to 60 (100%); 260 px = 100%; scale = 2.6 px per percentage point.
         y_screen = 320 - value * 2.6 -->

    <!-- Plot background panel -->
    <rect x="80" y="50" width="680" height="280" rx="6" fill="#1c2030" opacity="0.5"/>

    <!-- Gridlines (horizontal) -->
    <line class="grid" x1="100" y1="320" x2="740" y2="320"/>  <!-- 0% -->
    <line class="grid" x1="100" y1="255" x2="740" y2="255"/>  <!-- 25% -->
    <line class="grid" x1="100" y1="190" x2="740" y2="190"/>  <!-- 50% -->
    <line class="grid" x1="100" y1="125" x2="740" y2="125"/>  <!-- 75% -->
    <line class="grid" x1="100" y1="60"  x2="740" y2="60"/>   <!-- 100% -->

    <!-- y-axis -->
    <line class="axis" x1="100" y1="60" x2="100" y2="320"/>
    <text x="92" y="64" text-anchor="end" class="muted">100%</text>
    <text x="92" y="129" text-anchor="end" class="muted">75%</text>
    <text x="92" y="194" text-anchor="end" class="muted">50%</text>
    <text x="92" y="259" text-anchor="end" class="muted">25%</text>
    <text x="92" y="324" text-anchor="end" class="muted">0%</text>

    <!-- x-axis -->
    <line class="axis" x1="100" y1="320" x2="740" y2="320"/>

    <!-- Milestone labels at x = 100, 260, 420, 580, 740 -->
    <text x="100" y="346" text-anchor="middle" class="stage-lbl" fill="#8d94a8">MVP</text>
    <text x="260" y="346" text-anchor="middle" class="stage-lbl" fill="#7aa2f7">v1</text>
    <text x="420" y="346" text-anchor="middle" class="stage-lbl" fill="#8d94a8" style="text-decoration: line-through;">v1.5</text>
    <text x="420" y="362" text-anchor="middle" class="muted" font-size="9">(cut)</text>
    <text x="580" y="346" text-anchor="middle" class="stage-lbl" fill="#10b981">v2</text>
    <text x="740" y="346" text-anchor="middle" class="stage-lbl" fill="#8b5cf6">v3</text>

    <!-- =================== BENCHMARK REFERENCE LINE =================== -->
    <!-- Reference: industry benchmark = 25%. y = 320 - 25*2.6 = 320 - 65 = 255. -->
    <line class="ref" x1="100" y1="255" x2="760" y2="255"/>
    <text x="760" y="250" text-anchor="end" class="ann">industry benchmark = 25%</text>

    <!-- =================== ACTIVE USERS (blue, rising) =================== -->
    <!-- Values: MVP 14%, v1 12%, v1.5 (cut, faded), v2 28%, v3 34%
         y-coords: 320 - 14*2.6=283.6, 320-12*2.6=288.8, (skip), 320-28*2.6=247.2, 320-34*2.6=231.6 -->
    <polyline class="line-A"
              points="100,284 260,289 580,247 740,232"/>

    <!-- Dots -->
    <circle class="dot-A" cx="100" cy="284" r="5"/>
    <circle class="dot-A" cx="260" cy="289" r="5"/>
    <circle class="dot-A" cx="580" cy="247" r="5"/>
    <circle class="dot-A" cx="740" cy="232" r="5"/>

    <!-- Value labels -->
    <text x="100" y="276" text-anchor="middle" class="lbl" fill="#7aa2f7">14</text>
    <text x="260" y="281" text-anchor="middle" class="lbl" fill="#7aa2f7">12</text>
    <text x="580" y="239" text-anchor="middle" class="lbl" fill="#7aa2f7">28</text>
    <text x="740" y="224" text-anchor="middle" class="lbl" fill="#7aa2f7">34</text>

    <!-- =================== RETENTION (green, V-shaped with recovery) =================== -->
    <!-- Values: MVP 22%, v1 67%, (cut), v2 41%, v3 80%
         y: 263, 145, (skip), 213, 112 -->
    <polyline class="line-B"
              points="100,263 260,145 580,213 740,112"/>

    <circle class="dot-B" cx="100" cy="263" r="5"/>
    <circle class="dot-B" cx="260" cy="145" r="5"/>
    <circle class="dot-B" cx="580" cy="213" r="5"/>
    <circle class="dot-B" cx="740" cy="112" r="5"/>

    <text x="100" y="255" text-anchor="middle" class="lbl" fill="#10b981">22</text>
    <text x="260" y="137" text-anchor="middle" class="lbl" fill="#10b981">67</text>
    <text x="580" y="205" text-anchor="middle" class="lbl" fill="#10b981">41</text>
    <text x="740" y="104" text-anchor="middle" class="lbl" fill="#10b981">80</text>

    <!-- =================== NPS (yellow dashed, falling — the trade-off) =================== -->
    <!-- Values: MVP 45%, v1 43%, (cut), v2 44%, v3 35%
         y: 203, 208, (skip), 206, 229 -->
    <polyline class="line-C"
              points="100,203 260,208 580,206 740,229"/>

    <circle class="dot-C" cx="100" cy="203" r="5"/>
    <circle class="dot-C" cx="260" cy="208" r="5"/>
    <circle class="dot-C" cx="580" cy="206" r="5"/>
    <circle class="dot-C" cx="740" cy="229" r="5"/>

    <text x="100" y="195" text-anchor="middle" class="lbl" fill="#fbbf24">45</text>
    <text x="260" y="200" text-anchor="middle" class="lbl" fill="#fbbf24">43</text>
    <text x="580" y="198" text-anchor="middle" class="lbl" fill="#fbbf24">44</text>
    <text x="740" y="245" text-anchor="middle" class="lbl" fill="#fbbf24">35</text>

    <!-- =================== LEGEND =================== -->
    <g transform="translate(120, 38)">
      <rect x="0" y="0" width="540" height="20" rx="3" fill="#1c2030" stroke="#2a2f42"/>

      <line x1="14" y1="11" x2="40" y2="11" stroke="#7aa2f7" stroke-width="3"/>
      <text x="46" y="14" class="muted" font-size="11">Active users (headline)</text>

      <line x1="190" y1="11" x2="216" y2="11" stroke="#10b981" stroke-width="3"/>
      <text x="222" y="14" class="muted" font-size="11">Retention (stickiness)</text>

      <line x1="370" y1="11" x2="396" y2="11" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 3"/>
      <text x="402" y="14" class="muted" font-size="11">NPS (the trade)</text>
    </g>

    <!-- v1.5 grey overlay -->
    <rect x="340" y="60" width="160" height="260" fill="#2a2f42" opacity="0.4"/>

  </g>
</svg>

<figcaption id="fig-traj-cap">
  <strong>Figure N.</strong> Key metrics across the release roadmap. <span style="color:#7aa2f7">Active users</span>
  is the metric we're chasing — it dips slightly at v1 (onboarding got longer when we shipped the v1 feature set)
  and then climbs sharply through v2 and v3, clearing the 25% industry benchmark. <span style="color:#10b981">Retention</span>
  has a V-shape: strong at v1, eroded at v2, recovered at v3. <span style="color:#fbbf24">NPS</span>
  is the explicit trade — it slips ~10 points at v3 (the cost of introducing paid tiers). The v1.5 milestone is grayed out (cut from the roadmap).
</figcaption>
</figure>


<!-- ============================================================================
     COMMENTARY (read me, then delete me from your tutorial)
     ============================================================================
     The trajectory-plot pattern in 6 rules:

     1. ALL METRICS ON THE SAME SCALE if possible (here: 0-100%).
        Mixed scales (one in %, one in $) force the reader to mentally normalize.
        If you must mix, use two y-axes — but consider whether the comparison is meaningful.

     2. INCLUDE A REFERENCE LINE for the "target" or "industry benchmark".
        Without it, the reader doesn't know what "good" means.

     3. COLOR-CODE BY METRIC, not by milestone. Each metric gets its own consistent color
        through all your figures. (Milestones get their own colors in OTHER contexts, like
        a roadmap indicator.)

     4. LABEL THE FINAL VALUE on each line.
        "34" at the right edge of the Active-users line is what readers will remember. Make it readable.

     5. GRAY OUT cut milestones.
        Don't omit them entirely — the reader needs to know they existed and why they were
        cut. Visual de-emphasis + strikethrough on the label communicates this.

     6. DASHED LINE for the metric that REGRESSED (the trade).
        Solid lines are wins; dashed signals "this is the cost we accept."

     Use case checklist:
       ✓ Headline figure of a product review / launch readout
       ✓ Comparing trajectory across release milestones
       ✓ Showing trade-offs (some metrics up, others down)
       ✗ NOT for instantaneous comparison at a single point (use figure-comparison.html)
       ✗ NOT for system architecture (use figure-architecture.html)

     COORDINATE DERIVATION (the discipline):
       For each value, compute y_screen = y_zero - value * scale.
       e.g., axis spans y=320 (0%) to y=60 (100%), so scale = (320-60)/100 = 2.6 px per %.
       Active users at 34% → y = 320 - 34*2.6 = 320 - 88.4 = 231.6.
       NEVER hand-tune; always derive. Bear trap B.7.
     ============================================================================ -->

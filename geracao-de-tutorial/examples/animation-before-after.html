<!--
  EXAMPLE: Before/after interactive toggle
  =========================================
  A button toggles between two states. Each state is a complete static image;
  the reader compares them at their own pace. Different from an auto-looping
  animation because the reader controls the comparison.

  Concrete example: a UI page layout. "Before redesign": a cluttered layout with
  mismatched spacing, low-contrast text, and crowded, misaligned blocks. "After
  redesign": the same page blocks arranged on a clean aligned grid with clear
  hierarchy and generous whitespace. Toggle button switches the view; both states
  show the same page frame for honest comparison.

  Contrast with:
    - 3-phase animation (auto-cycles; reader can't dwell on one state)
    - Sweeper (continuous parameter; not a binary comparison)

  Use when:
    - Comparing two distinct configurations (with vs without, v1 vs v2)
    - The reader benefits from controlling the comparison cadence
    - Both states have the same "shape" but different content

  This example uses minimal JS — one toggle button changes a state variable
  and re-renders the SVG groups.
-->

<figure role="figure" aria-labelledby="anim-toggle-cap" id="figure-layout">
  <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap;">
    <button id="toggle-btn"
            type="button"
            aria-pressed="false"
            style="background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
                   padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: inherit;
                   font-size: 14px; font-weight: 600;">
      View: <span id="toggle-state">BEFORE redesign</span> &nbsp;⇄
    </button>
    <span style="color: var(--muted); font-size: 13px;">
      Click to switch between the cluttered original layout and the redesigned clean layout.
    </span>
  </div>

  <svg role="img"
       aria-labelledby="anim-toggle-title anim-toggle-desc"
       id="toggle-svg"
       viewBox="0 0 820 320"
       style="width:100%; height:auto; max-width:820px; background:#161922; border:1px solid #2a2f42; border-radius:8px;">

    <title id="anim-toggle-title">UI layout redesign: before vs after</title>
    <desc id="anim-toggle-desc">Two-state visualization toggled by a button. State BEFORE shows a cluttered
      page layout: a narrow misaligned header, crowded low-contrast nav items, mismatched and overlapping
      cards, and an awkwardly placed low-contrast button. State AFTER shows the same page blocks arranged on a
      clean aligned grid with even spacing, clear visual hierarchy, generous whitespace, and a prominent
      high-contrast button. The page frame is the same in both states for honest comparison.</desc>

    <style>
      #figure-layout { --block: #7aa2f7; --accent: #10b981; --divider: #2a2f42; }
      #toggle-svg .frame-lbl { font-family: system-ui, sans-serif; font-size: 11px; fill: #8d94a8; }
      #toggle-svg .title    { font-family: system-ui, sans-serif; font-size: 13px; fill: #e6e8ee; font-weight: 600; }
      #toggle-svg .legend   { font-family: ui-monospace, monospace; font-size: 11px; fill: #e6e8ee; }
      #toggle-svg .state-before { display: block; }
      #toggle-svg .state-after  { display: none; }
      #toggle-svg.is-after .state-before { display: none; }
      #toggle-svg.is-after .state-after  { display: block; }
    </style>

    <!-- Page frame (always visible — same canvas in both states) -->
    <rect x="60" y="44" width="580" height="214" rx="8" fill="#12151d" stroke="#2a2f42" stroke-width="1.5"/>
    <text x="60" y="278" class="frame-lbl">Same page frame in both views — only the interior layout changes.</text>

    <!-- Title strip -->
    <text x="20" y="28" class="title">UI layout — before and after redesign</text>

    <!-- ===================== STATE: BEFORE ===================== -->
    <!-- Cluttered layout: narrow off-set header, crowded uneven nav, mismatched
         overlapping cards, low-contrast awkward button. No clear hierarchy. -->
    <g class="state-before">

      <!-- Header — narrow, not full width, low contrast -->
      <rect x="72" y="56" width="284" height="24" rx="3" fill="#20232f" opacity="0.85" stroke="#2b3040"/>
      <text x="84" y="72" class="legend" fill="#565c6b" font-size="10">Header</text>

      <!-- Nav — crowded items, uneven baseline and widths, low contrast -->
      <rect x="402" y="54" width="40" height="15" rx="2" fill="#2b3040" opacity="0.85"/>
      <rect x="448" y="61" width="56" height="15" rx="2" fill="#2b3040" opacity="0.85"/>
      <rect x="510" y="52" width="34" height="15" rx="2" fill="#2b3040" opacity="0.85"/>
      <rect x="549" y="63" width="62" height="15" rx="2" fill="#2b3040" opacity="0.85"/>

      <!-- Cards — mismatched sizes, misaligned, one overlapping/crowded -->
      <rect x="72"  y="98"  width="150" height="82" rx="4" fill="#171b27" stroke="#272c3c"/>
      <rect x="236" y="112" width="118" height="60" rx="4" fill="#171b27" stroke="#272c3c"/>
      <rect x="344" y="94"  width="176" height="94" rx="4" fill="#171b27" stroke="#272c3c"/>
      <rect x="250" y="178" width="150" height="52" rx="4" fill="#171b27" stroke="#272c3c"/>

      <!-- Uneven inner content — reinforces the crowded, ragged feel -->
      <rect x="86"  y="112" width="104" height="9" rx="2" fill="#2a3040"/>
      <rect x="86"  y="128" width="64"  height="6" rx="2" fill="#242a38"/>
      <rect x="86"  y="142" width="88"  height="6" rx="2" fill="#242a38"/>
      <rect x="358" y="108" width="140" height="9" rx="2" fill="#2a3040"/>
      <rect x="358" y="126" width="150" height="6" rx="2" fill="#242a38"/>
      <rect x="358" y="140" width="96"  height="6" rx="2" fill="#242a38"/>
      <rect x="358" y="156" width="132" height="6" rx="2" fill="#242a38"/>

      <!-- Button — awkward placement, low contrast -->
      <rect x="470" y="200" width="88" height="26" rx="4" fill="#2b3040" opacity="0.85" stroke="#343a4c"/>
      <text x="514" y="217" text-anchor="middle" class="legend" fill="#5b6170" font-size="10">Button</text>

      <!-- State label -->
      <rect x="520" y="12" width="120" height="22" rx="4" fill="#1c2030" stroke="#ef4444"/>
      <text x="580" y="27" text-anchor="middle" class="legend" fill="#ef4444">BEFORE</text>

      <!-- Annotation -->
      <text x="350" y="250" text-anchor="middle" class="frame-lbl" font-style="italic">
        mismatched spacing · low contrast · crowded, misaligned blocks
      </text>
    </g>

    <!-- ===================== STATE: AFTER ===================== -->
    <!-- Same page blocks re-laid on a clean aligned grid: full-width header,
         evenly spaced nav, three equal cards, prominent high-contrast button. -->
    <g class="state-after">

      <!-- Header — full width, clear, with brand block + aligned nav -->
      <rect x="72" y="56" width="556" height="26" rx="4" fill="#232b45" stroke="#39456b"/>
      <rect x="84" y="63" width="64" height="12" rx="2" fill="#7aa2f7"/>
      <rect x="372" y="64" width="52" height="12" rx="2" fill="#8d94a8"/>
      <rect x="436" y="64" width="52" height="12" rx="2" fill="#8d94a8"/>
      <rect x="500" y="64" width="52" height="12" rx="2" fill="#8d94a8"/>
      <rect x="564" y="64" width="52" height="12" rx="2" fill="#8d94a8"/>

      <!-- Cards — equal size, aligned to a grid, even gaps, consistent content -->
      <rect x="72"  y="98" width="168" height="92" rx="6" fill="#161a26" stroke="#2a3350"/>
      <rect x="88"  y="114" width="104" height="10" rx="2" fill="#7aa2f7"/>
      <rect x="88"  y="134" width="136" height="7"  rx="2" fill="#39414f"/>
      <rect x="88"  y="148" width="120" height="7"  rx="2" fill="#39414f"/>
      <rect x="88"  y="162" width="136" height="7"  rx="2" fill="#39414f"/>

      <rect x="258" y="98" width="168" height="92" rx="6" fill="#161a26" stroke="#2a3350"/>
      <rect x="274" y="114" width="104" height="10" rx="2" fill="#7aa2f7"/>
      <rect x="274" y="134" width="136" height="7"  rx="2" fill="#39414f"/>
      <rect x="274" y="148" width="120" height="7"  rx="2" fill="#39414f"/>
      <rect x="274" y="162" width="136" height="7"  rx="2" fill="#39414f"/>

      <rect x="444" y="98" width="168" height="92" rx="6" fill="#161a26" stroke="#2a3350"/>
      <rect x="460" y="114" width="104" height="10" rx="2" fill="#7aa2f7"/>
      <rect x="460" y="134" width="136" height="7"  rx="2" fill="#39414f"/>
      <rect x="460" y="148" width="120" height="7"  rx="2" fill="#39414f"/>
      <rect x="460" y="162" width="136" height="7"  rx="2" fill="#39414f"/>

      <!-- Button — prominent, high contrast, aligned to the grid's right edge -->
      <rect x="520" y="204" width="108" height="28" rx="6" fill="#10b981"/>
      <text x="574" y="223" text-anchor="middle" class="legend" fill="#0b1120" font-weight="700">Button</text>

      <!-- State label -->
      <rect x="520" y="12" width="120" height="22" rx="4" fill="#1c2030" stroke="#10b981"/>
      <text x="580" y="27" text-anchor="middle" class="legend" fill="#10b981">AFTER</text>

      <!-- Annotation -->
      <text x="350" y="252" text-anchor="middle" class="frame-lbl" font-style="italic">
        aligned grid · clear hierarchy · generous whitespace
      </text>
    </g>

    <!-- Legend -->
    <g transform="translate(660, 50)">
      <rect x="0" y="0" width="150" height="80" rx="6" fill="#1c2030" stroke="#2a2f42"/>
      <rect x="16" y="18" width="18" height="12" rx="2" fill="#7aa2f7"/>
      <text x="42" y="28" class="legend">content block</text>
      <rect x="16" y="48" width="18" height="12" rx="2" fill="#10b981"/>
      <text x="42" y="58" class="legend">primary action</text>
    </g>
  </svg>

  <figcaption id="anim-toggle-cap">
    <strong>Interactive figure.</strong> Click the button to toggle between the cluttered original layout
    (mismatched spacing, low contrast, crowded misaligned blocks) and the redesigned layout (clean aligned
    grid, clear hierarchy, generous whitespace). Same page blocks in both views — only the arrangement changes.
  </figcaption>

  <script>
  (function() {
    var btn = document.getElementById('toggle-btn');
    var svg = document.getElementById('toggle-svg');
    var lbl = document.getElementById('toggle-state');
    var isAfter = false;

    btn.addEventListener('click', function() {
      isAfter = !isAfter;
      if (isAfter) {
        svg.classList.add('is-after');
        lbl.textContent = 'AFTER redesign';
        btn.setAttribute('aria-pressed', 'true');
        svg.setAttribute('aria-label', 'AFTER redesign: the same page blocks arranged on a clean aligned grid with clear hierarchy and whitespace');
      } else {
        svg.classList.remove('is-after');
        lbl.textContent = 'BEFORE redesign';
        btn.setAttribute('aria-pressed', 'false');
        svg.setAttribute('aria-label', 'BEFORE redesign: a cluttered layout with mismatched spacing, low contrast, and crowded misaligned blocks');
      }
    });
  })();
  </script>
</figure>


<!-- ============================================================================
     COMMENTARY (read me, then delete me from your tutorial)
     ============================================================================
     The before/after toggle pattern in 4 rules:

     1. SAME FRAME IN BOTH STATES — non-negotiable.
        If the frame changes, the reader can't compare directly. The states differ
        in CONTENT (what's laid out inside the frame), not the SHARED CANVAS.

     2. STATE-LABEL the active view.
        Both states should have a visible "BEFORE" / "AFTER" badge so a reader
        glancing at a screenshot can tell which they're looking at.

     3. UPDATE aria-label REACTIVELY on toggle.
        Screen-reader users can't see the state switch. The SVG's aria-label
        must change so it reflects the current state.

     4. USE class-toggle, NOT element add/remove.
        Both states are present in the DOM at all times; CSS display:none/block
        toggles visibility. Faster, no flicker, simpler JS.

     Implementation skeleton (minimal JS):
       svg.classList.toggle('is-after');
       lbl.textContent = isAfter ? 'AFTER' : 'BEFORE';

     Use case checklist:
       ✓ Comparing two configurations of the same system
       ✓ Before/after, v1/v2, A/B comparisons
       ✓ Showing what a transformation produces
       ✗ NOT for continuous parameter sweeps (use sweeper)
       ✗ NOT for sequence build-ups (use sequential reveal)
       ✗ NOT for auto-running demos (use 3-phase or just static figure)

     EXTENSIONS:
       - Three+ states: replace toggle with a small radio group or cycle button.
         Update class to is-state-1 / is-state-2 / is-state-3.
       - "Sweep" between two states with intermediate: add a slider, interpolate
         element positions in JS. This blurs the line with sweeper widgets.
     ============================================================================ -->

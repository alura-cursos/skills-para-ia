<!--
  EXAMPLE: Lineage tree with active vs dead branches
  ===================================================
  Static figure showing a tree of git branches / project versions /
  revisions, where the "active" path is highlighted in green and dead-end
  branches are shown in red strikethrough.

  Concrete example: a git branch tree. The main branch (kept, in green)
  goes from main → feature/search → feature/payments → release/2.0. A dead-end
  spike branch (in red, struck through) branched off feature/search and was
  abandoned; it's shown adjacent to clarify that release/2.0 is NOT downstream
  of the abandoned spike.

  Use when:
    - Documenting which branches survived vs were abandoned
    - Showing parent/child relationships in branch or revision trees
    - Disambiguating "X is a SIBLING, not an ANCESTOR" misconceptions
-->

<figure role="figure" aria-labelledby="fig-lineage-cap" aria-describedby="fig-lineage-desc">
<svg role="img"
     aria-labelledby="fig-lineage-title fig-lineage-desc"
     viewBox="0 0 820 380"
     style="width:100%; height:auto; max-width:820px; background:#161922; border:1px solid #2a2f42; border-radius:8px;">

  <title id="fig-lineage-title">Git branch tree: merged mainline vs abandoned spike branch</title>
  <desc id="fig-lineage-desc">A git branch tree starting from the main branch's initial commit at top. The
    main green path goes down the trunk through merged feature branches — feature/auth, feature/search,
    and feature/payments — arriving at release/2.0, the current tip of main tagged v2.0.0. A dead-end red
    branch shoots off rightward from feature/search's merge commit: a "spike/graphql" branch that was
    never merged after it hit an N+1 query blowup. The red branch is
    visually struck through with red dashes and labeled "DEAD END" to clarify that release/2.0 is NOT
    downstream of the abandoned spike — both descend from feature/search but only the green mainline was kept.
    A legend at the bottom shows: solid green = active/merged branch; red dashed = abandoned branch.</desc>

  <style>
    #fig-lineage-svg .box   { fill: #1c2030; stroke-width: 2; rx: 6; }
    #fig-lineage-svg .box-active { stroke: #10b981; }
    #fig-lineage-svg .box-dead   { stroke: #ef4444; stroke-dasharray: 4 4; }
    #fig-lineage-svg .box-base   { stroke: #7aa2f7; }
    #fig-lineage-svg .arr-active { stroke: #10b981; stroke-width: 2; fill: none; }
    #fig-lineage-svg .arr-dead   { stroke: #ef4444; stroke-width: 2; stroke-dasharray: 5 3; fill: none; }
    #fig-lineage-svg .title { font-family: system-ui, sans-serif; fill: #e6e8ee; font-size: 13px; font-weight: 600; }
    #fig-lineage-svg .lbl   { font-family: ui-monospace, monospace; fill: #e6e8ee; font-size: 11px; }
    #fig-lineage-svg .muted { font-family: system-ui, sans-serif; fill: #8d94a8; font-size: 11px; }
    #fig-lineage-svg .strike { text-decoration: line-through; }
    #fig-lineage-svg .ann   { font-family: system-ui, sans-serif; fill: #fbbf24; font-size: 11px; font-style: italic; }
  </style>

  <defs>
    <marker id="arr-active" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arr-dead" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <g id="fig-lineage-svg">

    <text x="20" y="28" class="title">Git branches — which we merged (and which we abandoned)</text>

    <!-- =================== MAIN BRANCH (LEFT COLUMN) =================== -->

    <!-- Root commit (start of lineage) -->
    <rect class="box box-base" x="200" y="50" width="220" height="44"/>
    <text x="310" y="72" text-anchor="middle" class="title" fill="#7aa2f7">main</text>
    <text x="310" y="86" text-anchor="middle" class="muted">repo root · commit a1b2c3d</text>

    <line class="arr-active" x1="310" y1="94" x2="310" y2="114" marker-end="url(#arr-active)"/>

    <!-- Stage A: feature/auth merged -->
    <rect class="box box-active" x="200" y="116" width="220" height="44"/>
    <text x="310" y="138" text-anchor="middle" class="title" fill="#10b981">feature/auth</text>
    <text x="310" y="152" text-anchor="middle" class="muted">merged into main</text>

    <line class="arr-active" x1="310" y1="160" x2="310" y2="180" marker-end="url(#arr-active)"/>

    <!-- Stage B: feature/search merged — the BRANCH POINT -->
    <rect class="box box-active" x="200" y="182" width="220" height="50"/>
    <text x="310" y="204" text-anchor="middle" class="title" fill="#10b981">feature/search</text>
    <text x="310" y="222" text-anchor="middle" class="muted">merged into main</text>

    <text x="430" y="208" class="ann">← branch point</text>

    <line class="arr-active" x1="310" y1="232" x2="310" y2="252" marker-end="url(#arr-active)"/>

    <!-- Stage C: feature/payments merged -->
    <rect class="box box-active" x="200" y="254" width="220" height="44"/>
    <text x="310" y="276" text-anchor="middle" class="title" fill="#10b981">feature/payments</text>
    <text x="310" y="290" text-anchor="middle" class="muted">merged into main</text>

    <line class="arr-active" x1="310" y1="298" x2="310" y2="318" marker-end="url(#arr-active)"/>

    <!-- FINAL: release/2.0 -->
    <rect class="box box-active" x="200" y="320" width="220" height="44" stroke-width="3"/>
    <text x="310" y="342" text-anchor="middle" class="title" fill="#10b981">release/2.0</text>
    <text x="310" y="356" text-anchor="middle" class="muted">HEAD of main (RELEASED)</text>

    <!-- =================== DEAD-END BRANCH (RIGHT COLUMN) =================== -->

    <!-- Branch from feature/search going right -->
    <path class="arr-dead"
          d="M 420,207 Q 460,207 480,242"
          marker-end="url(#arr-dead)"/>

    <!-- Dead-end spike branch -->
    <rect class="box box-dead" x="480" y="244" width="280" height="54"/>
    <text x="620" y="266" text-anchor="middle" class="title strike" fill="#ef4444">spike/graphql</text>
    <text x="620" y="284" text-anchor="middle" class="muted">feature/search → spike/graphql</text>
    <text x="620" y="296" text-anchor="middle" class="ann" fill="#ef4444">never merged · N+1 query blowup</text>

    <!-- Death label below -->
    <rect x="490" y="312" width="260" height="22" rx="3" fill="#1c2030" stroke="#ef4444" stroke-dasharray="3 2"/>
    <text x="620" y="327" text-anchor="middle" class="lbl" fill="#ef4444" font-weight="600">⊘ DEAD END — DO NOT REVIVE</text>

    <!-- Sibling annotation -->
    <text x="500" y="220" class="ann">feature/search has TWO children:</text>
    <text x="500" y="234" class="ann">we kept the green one →</text>

    <!-- =================== LEGEND =================== -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="140" height="68" rx="6" fill="#1c2030" stroke="#2a2f42"/>
      <text x="10" y="18" class="muted" font-size="11" font-weight="600">legend</text>

      <line x1="10" y1="34" x2="40" y2="34" stroke="#10b981" stroke-width="2"/>
      <text x="46" y="38" class="lbl" font-size="11">merged</text>

      <line x1="10" y1="52" x2="40" y2="52" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 3"/>
      <text x="46" y="56" class="lbl" font-size="11">abandoned</text>
    </g>

  </g>
</svg>

<figcaption id="fig-lineage-cap">
  <strong>Figure N.</strong> Git branch tree. Green = active mainline leading to release/2.0.
  Red dashed = abandoned branch. <em>Critical disambiguation:</em> the
  spike/graphql branch is a SIBLING of feature/payments, not an ancestor of release/2.0. Both
  descend from feature/search but only the green mainline was kept.
</figcaption>
</figure>


<!-- ============================================================================
     COMMENTARY (read me, then delete me from your tutorial)
     ============================================================================
     The lineage-tree pattern in 5 rules:

     1. SOLID GREEN = active, DASHED RED = abandoned.
        Consistent across all your lineage figures. Don't switch colors per figure.

     2. THICKER BORDER on the FINAL/current node.
        Reader's eye lands on it immediately. Make it unmistakable.

     3. CALL OUT BRANCH POINTS with annotations.
        "← branch point" or "feature/search has TWO children" prevents the "I thought X was
        downstream of Y" misreading. Lineage figures exist to disambiguate, not just decorate.

     4. INCLUDE THE FAILURE REASON next to the dead branch.
        "never merged · N+1 query blowup" tells the reader WHY the branch was abandoned. Without
        it, the figure raises a question instead of answering one.

     5. ADD A "DO NOT REVIVE" LABEL on branches that must stay dead.
        Future readers (including your future self) will be tempted to revive a "promising-
        looking" branch. The label is a written warning.

     Use case checklist:
       ✓ Documenting branch / revision lineage
       ✓ Showing branch/version history
       ✓ Disambiguating sibling vs ancestor relationships
       ✓ Recording why branches were abandoned
       ✗ NOT for dynamic processes (use sequential reveal)
       ✗ NOT for parallel systems (use figure-architecture.html)

     Common lineage patterns:
       - Single trunk + side branches (this example): main line down center, side branches off
       - Y-fork: two divergent paths from a common ancestor
       - Multi-generation: deep tree with many leaves; consider grouping similar leaves
       - Tag/version history: like git log --graph
     ============================================================================ -->

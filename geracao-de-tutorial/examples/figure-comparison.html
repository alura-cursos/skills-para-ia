<!--
  EXAMPLE: Side-by-side comparison figure
  ========================================
  Static figure showing two or three things in parallel columns for direct
  visual comparison. Used to contrast architectures, model families,
  algorithms, or any "X vs Y" content.

  Concrete example: three algorithm families compared on the same axes —
  characteristics, complexity, when-to-use, and one critical limitation. The
  comparison is honest: each family wins at something different.
-->

<figure role="figure" aria-labelledby="fig-cmp-cap" aria-describedby="fig-cmp-desc">
<svg role="img"
     aria-labelledby="fig-cmp-title fig-cmp-desc"
     viewBox="0 0 820 340"
     style="width:100%; height:auto; max-width:820px; background:#161922; border:1px solid #2a2f42; border-radius:8px;">

  <title id="fig-cmp-title">Three algorithm families compared side-by-side</title>
  <desc id="fig-cmp-desc">A three-column comparison figure. Left column (blue) describes a Greedy
    family with O(n) complexity, simple to implement, but fails to find global optimum. Middle column
    (green) describes a Dynamic-Programming family with O(n²) complexity, optimal results, but high
    memory cost. Right column (violet) describes a Heuristic family with O(n log n) complexity,
    near-optimal results, and tunable trade-offs. Each column has the same 4 rows: complexity, when
    to use, key strength, critical limitation. The middle column is highlighted with a thicker border
    as "recommended for this tutorial's use case."</desc>

  <style>
    #fig-cmp-svg .col-bg     { fill: #1c2030; rx: 8; ry: 8; }
    #fig-cmp-svg .col-A      { stroke: #7aa2f7; stroke-width: 2; }
    #fig-cmp-svg .col-B      { stroke: #10b981; stroke-width: 3; }  /* thicker = recommended */
    #fig-cmp-svg .col-C      { stroke: #8b5cf6; stroke-width: 2; }
    #fig-cmp-svg .header     { font-family: system-ui, sans-serif; font-weight: 600; font-size: 14px; }
    #fig-cmp-svg .row-lbl    { font-family: system-ui, sans-serif; font-size: 11px; fill: #8d94a8; text-transform: uppercase; letter-spacing: 0.4px; }
    #fig-cmp-svg .row-val    { font-family: ui-monospace, monospace; font-size: 12px; fill: #e6e8ee; }
    #fig-cmp-svg .badge      { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; }
    #fig-cmp-svg .ann        { font-family: system-ui, sans-serif; font-style: italic; font-size: 11px; fill: #94a3b8; }
    #fig-cmp-svg .divider    { stroke: #2a2f42; stroke-width: 1; stroke-dasharray: 2 3; }
  </style>

  <g id="fig-cmp-svg">

    <text x="20" y="28" class="header" fill="#e6e8ee">Algorithm family selection — 3 options compared</text>

    <!-- =================== THREE COLUMN BOXES =================== -->

    <!-- Column A (left) -->
    <rect class="col-bg col-A" x="40" y="50" width="240" height="270"/>
    <text x="160" y="78" text-anchor="middle" class="header" fill="#7aa2f7">Greedy family</text>
    <text x="160" y="96" text-anchor="middle" class="ann">e.g., Dijkstra, Kruskal</text>
    <line class="divider" x1="60" y1="108" x2="260" y2="108"/>

    <!-- Column B (middle, highlighted) -->
    <rect class="col-bg col-B" x="290" y="50" width="240" height="270"/>
    <!-- Recommended badge -->
    <rect x="380" y="42" width="60" height="18" rx="3" fill="#10b981"/>
    <text x="410" y="56" text-anchor="middle" class="badge" fill="#0f1117">RECOMMENDED</text>

    <text x="410" y="78" text-anchor="middle" class="header" fill="#10b981">Dynamic programming</text>
    <text x="410" y="96" text-anchor="middle" class="ann">e.g., Bellman-Ford, edit distance</text>
    <line class="divider" x1="310" y1="108" x2="510" y2="108"/>

    <!-- Column C (right) -->
    <rect class="col-bg col-C" x="540" y="50" width="240" height="270"/>
    <text x="660" y="78" text-anchor="middle" class="header" fill="#8b5cf6">Heuristic family</text>
    <text x="660" y="96" text-anchor="middle" class="ann">e.g., A*, simulated annealing</text>
    <line class="divider" x1="560" y1="108" x2="760" y2="108"/>

    <!-- =================== ROWS =================== -->
    <!-- Row 1: complexity (y=130) -->
    <text x="60" y="130" class="row-lbl">complexity</text>
    <text x="60" y="148" class="row-val">O(n) or O(n log n)</text>

    <text x="310" y="130" class="row-lbl">complexity</text>
    <text x="310" y="148" class="row-val">O(n²) or O(n·V)</text>

    <text x="560" y="130" class="row-lbl">complexity</text>
    <text x="560" y="148" class="row-val">O(n log n) expected</text>

    <!-- Row 2: when to use (y=176) -->
    <text x="60" y="176" class="row-lbl">when to use</text>
    <text x="60" y="194" class="row-val">local optimum suffices</text>
    <text x="60" y="208" class="row-val">large input, fast answer</text>

    <text x="310" y="176" class="row-lbl">when to use</text>
    <text x="310" y="194" class="row-val">global optimum required</text>
    <text x="310" y="208" class="row-val">moderate input size</text>

    <text x="560" y="176" class="row-lbl">when to use</text>
    <text x="560" y="194" class="row-val">huge state space</text>
    <text x="560" y="208" class="row-val">approximate OK</text>

    <!-- Row 3: key strength (y=232) -->
    <text x="60" y="232" class="row-lbl">key strength</text>
    <text x="60" y="252" class="row-val" fill="#10b981">⚡ simplest to implement</text>

    <text x="310" y="232" class="row-lbl">key strength</text>
    <text x="310" y="252" class="row-val" fill="#10b981">⚡ provably optimal</text>

    <text x="560" y="232" class="row-lbl">key strength</text>
    <text x="560" y="252" class="row-val" fill="#10b981">⚡ tunable trade-offs</text>

    <!-- Row 4: critical limitation (y=275) -->
    <text x="60" y="275" class="row-lbl">⚠ limitation</text>
    <text x="60" y="295" class="row-val" fill="#ef4444">may miss global</text>
    <text x="60" y="309" class="row-val" fill="#ef4444">optimum</text>

    <text x="310" y="275" class="row-lbl">⚠ limitation</text>
    <text x="310" y="295" class="row-val" fill="#ef4444">memory cost</text>
    <text x="310" y="309" class="row-val" fill="#ef4444">grows with input</text>

    <text x="560" y="275" class="row-lbl">⚠ limitation</text>
    <text x="560" y="295" class="row-val" fill="#ef4444">no optimality</text>
    <text x="560" y="309" class="row-val" fill="#ef4444">guarantee</text>

  </g>
</svg>

<figcaption id="fig-cmp-cap">
  <strong>Figure N.</strong> Three algorithm families on the same comparison axes. Same 4 questions
  asked of each. <span style="color:#10b981">Dynamic programming</span> (middle) is highlighted as the
  recommended choice for this tutorial's use case — but the figure is honest that the other two
  families win on different axes (greedy is simpler; heuristic scales further). Use this pattern when
  you need to surface "honest trade-offs" rather than a one-way pitch.
</figcaption>
</figure>


<!-- ============================================================================
     COMMENTARY (read me, then delete me from your tutorial)
     ============================================================================
     The side-by-side comparison pattern in 5 rules:

     1. SAME ROWS, ALL COLUMNS.
        Every column must answer the SAME questions in the SAME order. The reader's
        eye scans horizontally across rows to compare. If columns answer different
        questions, you've made an architecture diagram, not a comparison.

     2. RECOMMEND ONE — DON'T HEDGE.
        If the tutorial's context implies a "best choice," visually highlight it
        (thicker border, badge). But ALSO honestly report what the other options
        win at — bullet 5.

     3. INCLUDE THE LIMITATION ROW.
        A comparison without "here's what's bad about each" is propaganda. The
        "⚠ limitation" row in red turns the figure into honest pedagogy.

     4. NO COMPARATIVE COMPLEXITY IN PROSE — USE THE GRID.
        Don't say "DP is slower but more accurate than greedy." Show O(n²) vs O(n) in
        the complexity row; show "may miss global" vs "provably optimal" in the
        limitation row. The grid makes claims auditable.

     5. CAP AT 3 COLUMNS.
        4-column comparisons crowd the eye. If you have 4+ things to compare, either
        pick the 3 most important or use a table.

     Use case checklist:
       ✓ "Which algorithm should I use?"
       ✓ "What are the trade-offs between A and B?"
       ✓ "How does v1 differ from v2?"
       ✗ NOT for showing dependencies (use figure-architecture.html)
       ✗ NOT for hierarchy (use figure-lineage-tree.html)
       ✗ NOT for trends over time (use figure-trajectory.html)

     EXTENSIONS:
       - Add a small bar chart in each column for one quantitative metric.
       - Use icons in row labels for visual scanning.
       - For 2-column comparisons, use wider columns and more rows.
     ============================================================================ -->
